<!-- Backstory -->
<text x="377" y="310" class="red" font-size="18">IV.</text>
<text x="406" y="310" class="heading">BACKSTORY</text>
<path d="M377 322H952" class="dark-rule"/>

<text x="377" y="348" class="body">I'm Lydon, a game developer studying at MCAST. I build dungeon</text>
<text x="377" y="373" class="body">crawlers, experiment with gameplay systems, and take inspiration</text>
<text x="377" y="398" class="body">from the stories we tell around a table.</text>
<text x="377" y="439" class="body">B.Sc. (Hons) Digital Games Development</text>
<text x="377" y="464" class="small">MCAST · 2024–present</text>

<!-- Projects -->
<text x="377" y="529" class="red" font-size="18">V.</text>
<text x="406" y="529" class="heading">RECORDED ADVENTURES</text>
<path d="M377 541H952" class="dark-rule"/>

<text x="377" y="569" class="label">UNREAL ENGINE 5 / C++</text>
<text x="377" y="604" font-size="29">Unreal Dice Dungeon</text>
<text x="377" y="634" class="body">A first-person slasher through procedurally generated dungeons,</text>
<text x="377" y="658" class="body">with enemies, shops, and items.</text>
<path d="M377 702H952" class="rule"/>

<text x="377" y="724" class="label">UNITY / C#</text>
<text x="377" y="759" font-size="29">Bookworm</text>
<text x="377" y="789" class="body">A spell-slinging dungeon crawler set in a library. Projectiles</text>
<text x="377" y="813" class="body">interact, and bombs detonate when hit by another weapon.</text>
<path d="M377 857H952" class="rule"/>

<text x="377" y="879" class="label">UNITY / C#</text>
<text x="377" y="914" font-size="29">Dice Game</text>
<text x="377" y="944" class="body">Combat, a skill tree, a map, and a shop — built with ProBuilder,</text>
<text x="377" y="968" class="body">Cinemachine, and UI Toolkit.</text>
<path d="M377 1012H952" class="rule"/>

